# Isolated in-memory database for automated tests. Never points at a real MySQL schema.
spring.datasource.url=jdbc:h2:mem:farmcrop-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Run the real Flyway migrations so schema changes are exercised by every test run.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

farmcrop.cors.allowed-origins=http://localhost:5173

# Test-only signing key (base64 of a public, obviously fake phrase). Never used outside tests.
farmcrop.security.jwt.secret=ZmFybWNyb3AtdGVzdC1vbmx5LWhtYWMta2V5LU5PVC1mb3ItcHJvZHVjdGlvbiEh
# Explicitly blank so a developer's backend/.env can never create an admin inside tests.
farmcrop.admin.username=
farmcrop.admin.email=
farmcrop.admin.password=
farmcrop.scheduling.enabled=false
