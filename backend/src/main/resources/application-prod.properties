# Production: every connection value must be supplied by the environment (no defaults).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8&connectionTimeZone=UTC&sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

farmcrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.forward-headers-strategy=native
# Client IPs (used for per-IP rate limits) come from X-Forwarded-For ONLY when the request arrives from a trusted
# proxy. Tomcat's default trusts private-network addresses (10.x, 192.168.x, 172.16-31.x, 127.x, ::1). If your
# load balancer / reverse proxy / CDN connects from other addresses, set a regex of its IPs at deploy time, e.g.
#   SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES=203\.0\.113\.10|203\.0\.113\.11
# Otherwise every user appears to share the proxy's IP and per-IP limits would apply to everyone at once.
# Never trust all addresses: clients could then forge X-Forwarded-For to evade the limits.
