# Production: every connection value must be supplied by the environment (no defaults).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8&connectionTimeZone=UTC&sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

farmcrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.forward-headers-strategy=native
