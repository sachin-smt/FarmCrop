# Local development against a local MySQL server.
# Credentials come from environment variables or the git-ignored backend/.env file.
# The database must already exist (create it once with backend/scripts/create-database.sql); the app never
# creates databases, so a mistyped DB_NAME fails fast instead of silently creating an empty schema.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmcrop}?serverTimezone=UTC&characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
