# Local development against a local MySQL server.
# Credentials come from environment variables or the git-ignored backend/.env file.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmcrop}?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
