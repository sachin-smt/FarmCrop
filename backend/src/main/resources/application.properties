spring.application.name=farmcrop-backend

# Local development is the default; production must set SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.default=dev

# Optional git-ignored secrets file (see backend/.env.example). Real environment variables take precedence.
# The first path applies when started from backend/, the second when started from the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Comma-separated list of browser origins allowed to call the API.
farmcrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
