spring.application.name=farmcrop-backend

# No default profile on purpose (fail closed): a server started without SPRING_PROFILES_ACTIVE has no
# datasource and refuses to start, instead of silently running development settings in production.
# Local runs: ./mvnw spring-boot:run (activates "dev" via pom.xml) or --spring.profiles.active=dev.

# Optional git-ignored secrets file (see backend/.env.example). Real environment variables take precedence.
# The first path applies when started from backend/, the second when started from the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Map java.time.Instant to plain DATETIME(6)/TIMESTAMP columns (stored as UTC) on MySQL and H2 alike.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Never allow Flyway's destructive "clean" (drops every object in the schema), and never baseline over an
# unknown existing schema: migrations must start from an empty database or a known history.
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Connection pool (HikariCP).
spring.datasource.hikari.pool-name=farmcrop-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# --- Authentication ---
# Base64-encoded HMAC key, at least 32 bytes after decoding. Required; startup fails without it.
farmcrop.security.jwt.secret=${JWT_SECRET:}
farmcrop.security.jwt.issuer=farmcrop
farmcrop.security.jwt.access-token-ttl=15m
farmcrop.security.refresh-token-ttl=14d
# Secure cookies are accepted by browsers on http://localhost, so this stays true in development too.
farmcrop.security.cookie-secure=${COOKIE_SECURE:true}
farmcrop.security.login-max-failures=5
farmcrop.security.login-failure-window=15m

# One-time admin bootstrap: used only while no ADMIN account exists. Never resets an existing admin.
farmcrop.admin.username=${FARMCROP_ADMIN_USERNAME:}
farmcrop.admin.email=${FARMCROP_ADMIN_EMAIL:}
farmcrop.admin.password=${FARMCROP_ADMIN_PASSWORD:}

# Comma-separated list of browser origins allowed to call the API.
farmcrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Health includes the database connection (status only; no details are exposed publicly).
management.health.db.enabled=true

# API docs are off unless a profile (dev) turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
